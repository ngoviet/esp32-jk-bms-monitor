# Tích hợp common.yaml để tái sử dụng config chung
<<: !include common.yaml

external_components:
  - source: github://syssi/esphome-jk-bms@main

esphome:
  name: 24v280ah
  friendly_name: 24v280ah

esp32:
  board: esp32dev

# ──────────────────────────── Wi-Fi networks riêng ────────────────────────────
wifi:
  networks:
    # === Aruba T1 (Channel 1) ===
    # - ssid: !secret wifi_ssid
    #   password: !secret wifi_password
    #   bssid: !secret wifi_bssid_t1
    #   channel: !secret wifi_channel_t1

    # === Aruba T2 (Channel 6) ===
    # - ssid: !secret wifi_ssid
    #   password: !secret wifi_password
    #   bssid: !secret wifi_bssid_t2
    #   channel: !secret wifi_channel_t2

    # === Aruba T3 (Channel 11) - Hiện tại active ===
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: !secret wifi_bssid_t3
      channel: !secret wifi_channel_t3

uart:
  id: uart_0
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 115200
  rx_buffer_size: 1024        

jk_modbus:
  id: modbus0
  uart_id: uart_0

jk_bms:
  id: bms0
  jk_modbus_id: modbus0
  update_interval: 5s

sensor:
  - platform: jk_bms
    
    total_voltage:
      name: "Total Voltage"
    current:
      name: "Current"
    power:
      name: "Power"
    charging_power:
