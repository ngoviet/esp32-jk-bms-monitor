# =============================================================================
# ESP32 đọc JK-BMS pin LiFePO4 24 V 280 Ah (8 cell) — tầng 3
# Cổng GPS/RS485 của BMS (UART-TTL) → ESP32 GPIO16 (TX) / GPIO17 (RX)
# Thư viện: syssi/esphome-jk-bms 3.1.0 (cần ESPHome ≥ 2026.1.0)
#
# ⚠️ Mọi `name:` bên dưới là nguồn của entity_id trên Home Assistant
#    (sensor.tang_3_24v280ah_*): dashboard, package năng lượng và loa Xiaozhi
#    đọc theo các tên này. KHÔNG đổi tên, kể cả tên lạ như
#    "Cell Pressure Difference Protection" hay "balancing switch".
# =============================================================================

substitutions:
  name: 24v280ah
  friendly_name: 24v280ah
  log_level: DEBUG
  tx_pin: GPIO16
  rx_pin: GPIO17

packages:
  common: !include common.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "JK-BMS 24V 280Ah tầng 3 (RS485/UART)"
  min_version: 2026.1.0

esp32:
  board: esp32dev

external_components:
  # Ghim theo tag phát hành, không theo nhánh main (main đổi hằng ngày).
  - source: github://syssi/esphome-jk-bms@3.1.0
    components: [jk_modbus, jk_bms]

# ───────────────────────── Đường truyền tới BMS ─────────────────────────
uart:
  id: uart_0
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 115200
  rx_buffer_size: 1024

jk_modbus:
  id: modbus0
  uart_id: uart_0
  rx_timeout: 50ms

jk_bms:
  id: bms0
  jk_modbus_id: modbus0
  update_interval: 5s

# ───────────────────────── Trạng thái ─────────────────────────
binary_sensor:
  - platform: jk_bms
    balancing:
      name: "Balancing"
    balancing_switch:
      name: "balancing switch"
    charging:
      name: "Charging"
    discharging:
      name: "Discharging"
    dedicated_charger_switch:
      name: "dedicated charger switch"
    online_status:
      name: "Online Status"

# Bật/tắt MOSFET sạc, xả của BMS (HA nên chặn gọi nhầm).
switch:
  - platform: jk_bms
    charging:
      name: "Charging"
    discharging:
      name: "Discharging"

sensor:
  - platform: jk_bms
    # ── Pin ──
    total_voltage:
      name: "Total Voltage"
    current:
      name: "Current"
    power:
      name: "Power"
    charging_power:
      name: "Charging Power"
    discharging_power:
      name: "Discharging Power"
    state_of_charge:
      name: "Remaining Capacity"
    capacity_remaining:
      name: "Capacity Remaining Derived"
    actual_battery_capacity:
      name: "Actual Battery Capacity"
    charging_cycles:
      name: "Charging Cycles"
    total_charging_cycle_capacity:
      name: "Total Charging Cycle Capacity"
    total_runtime:
      name: "Total Runtime"
    cell_count:
      name: "Battery Strings"

    # ── Cell ──
    min_cell_voltage:
      name: "Min Cell V"
    max_cell_voltage:
      name: "Max Cell V"
    min_voltage_cell:
      name: "Min voltage cell"
    max_voltage_cell:
      name: "Max voltage cell"
    delta_cell_voltage:
      name: "Delta Cell V"
    average_cell_voltage:
      name: "Average Cell V"
    cell_voltage_1:
      name: "Cell 1 Voltage"
    cell_voltage_2:
      name: "Cell 2 Voltage"
    cell_voltage_3:
      name: "Cell 3 Voltage"
    cell_voltage_4:
      name: "Cell 4 Voltage"
    cell_voltage_5:
      name: "Cell 5 Voltage"
    cell_voltage_6:
      name: "Cell 6 Voltage"
    cell_voltage_7:
      name: "Cell 7 Voltage"
    cell_voltage_8:
      name: "Cell 8 Voltage"

    # ── Nhiệt độ ──
    mosfet_temperature:
      name: "MOSFET Temperature"
    temperature_sensor_1:
      name: "Temperature Sensor 1"
    temperature_sensor_2:
      name: "Temperature Sensor 2"

    # ── Trạng thái dạng bit ──
    errors_bitmask:
      name: "Error Bitmask"
    operation_mode_bitmask:
      name: "Operation Mode Bitmask"

    # ── Ngưỡng bảo vệ (BMS chỉ báo, ESP không ghi) ──
    total_voltage_overvoltage_protection:
      name: "Total Voltage Overvoltage Protection"
    total_voltage_undervoltage_protection:
      name: "Total Voltage Undervoltage Protection"
    cell_voltage_overvoltage_protection:
      name: "Cell Voltage Overvoltage Protection"
    cell_voltage_overvoltage_recovery:
      name: "Cell Voltage Overvoltage Recovery"
    cell_voltage_overvoltage_delay:
      name: "Cell Voltage Overvoltage Delay"
    cell_voltage_undervoltage_protection:
      name: "Cell Voltage Undervoltage Protection"
    cell_voltage_undervoltage_recovery:
      name: "Cell Voltage Undervoltage Recovery"
    cell_voltage_undervoltage_delay:
      name: "Cell Voltage Undervoltage Delay"
    cell_voltage_difference_protection:
      name: "Cell Pressure Difference Protection"
    discharging_overcurrent_protection:
      name: "Discharging Overcurrent Protection"
    discharging_overcurrent_delay:
      name: "Discharging Overcurrent Delay"
    charging_overcurrent_protection:
      name: "Charging Overcurrent Protection"
    charging_overcurrent_delay:
      name: "Charging Overcurrent Delay"
    balancing_start_voltage:
      name: "Balance Starting Voltage"
    balancing_delta_voltage:
      name: "Balance Opening Pressure Difference"
    mosfet_overtemperature_protection:
      name: "Power Tube Temperature Protection"
    mosfet_overtemperature_recovery:
      name: "Power Tube Temperature Recovery"
    battery_overtemperature_protection:
      name: "Temperature Sensor Temperature Protection"
    battery_overtemperature_recovery:
      name: "Temperature Sensor Temperature Recovery"
    battery_temperature_difference_protection:
      name: "Temperature Sensor Temperature Difference Protection"
    charging_overtemperature_protection:
      name: "Charging High Temperature Protection"
    discharging_overtemperature_protection:
      name: "Discharging High Temperature Protection"
    charging_undertemperature_protection:
      name: "Charging Low Temperature Protection"
    charging_undertemperature_recovery:
      name: "Charging Low Temperature Recovery"
    discharging_undertemperature_protection:
      name: "Discharging Low Temperature Protection"
    discharging_undertemperature_recovery:
      name: "Discharging Low Temperature Recovery"

    # ── Thông số cài đặt ──
    full_charge_capacity:
      name: "Total Battery Capacity Setting"
    current_calibration:
      name: "Current Calibration"
    device_address:
      name: "Device Address"
    sleep_wait_time:
      name: "Sleep Wait Time"
    low_soc_alarm_threshold:
      name: "Alarm Low Volume"
    manufacturing_date:
      name: "Manufacturing Date"

text_sensor:
  - platform: jk_bms
    errors:
      name: "Errors"
    operation_mode:
      name: "Operation Mode"
    battery_type:
      name: "Battery Type"
    software_version:
      name: "Software Version"
    manufacturer:
      name: "Manufacturer"
    password:
      name: "Password"
    device_type:
      name: "Device Type"
    total_runtime_formatted:
      name: "Total Runtime Formatted"
