# Tích hợp common.yaml để tái sử dụng config chung
<<: !include common.yaml

external_components:
  # 3.0.0 + bản sửa biên dịch cho ESPHome 2026.11 (tag 3.0.0 thiếu format_hex_pretty), ghim 19/11/2026
  - source: github://syssi/esphome-jk-bms@daa3f7719096ca5bf127b6a9dfdaa4454d7de83f

esphome:
  name: 24v280ah
  friendly_name: 24v280ah

esp32:
  board: esp32dev
  # Ghi rõ: khối esp32 của common.yaml bị bỏ khi trộn '<<', bản 2025.9.1 trước đây
  # vì thế chạy Arduino. Từ 19/11/2026 chạy ESP-IDF (mặc định từ ESPHome 2026.1).
  framework:
    type: esp-idf

# ──────────────────────────── Wi-Fi networks riêng ────────────────────────────
wifi:
  networks:
    # Không ghim BSSID/kênh nữa (19/11/2026): Aruba tự đổi kênh (T3 nay ở kênh 1),
    # mà ESPHome 2026.x chỉ nhận AP đúng kênh đã ghim -> thiết bị mất mạng sau
    # khi nạp. Để thiết bị tự quét và chọn AP mạnh nhất, như các repo khác (18/11).
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

uart:
  id: uart_0
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 115200
  rx_buffer_size: 1024        

jk_modbus:
  id: modbus0
  uart_id: uart_0

jk_bms:
  id: bms0
  jk_modbus_id: modbus0
  update_interval: 5s

sensor:
