# =============================================================================
# Cấu hình chung cho ESP32 trong nhà (nạp bằng `packages:` ở file thiết bị)
#
# Dùng `packages:` chứ không dùng `<<: !include`: `<<` là phép trộn YAML nông,
# file thiết bị khai báo `wifi:`/`sensor:` là thay HẲN khối đó của file này
# (trước 22/11/2026 vì thế mất fast_connect=false, reboot_timeout và toàn bộ
# cảm biến chẩn đoán). `packages:` trộn sâu: dict gộp khoá, list nối thêm.
# =============================================================================

esp32:
  framework:
    type: esp-idf

# ───────────────────────── Dịch vụ lõi ─────────────────────────
logger:
  baud_rate: 115200
  level: ${log_level}

api:
  # 0s = không tự khởi động lại khi mất kết nối HA (đọc BMS vẫn chạy).
  reboot_timeout: 0s

# Không đặt mật khẩu OTA (chủ chốt 22/11/2026): thiết bị chỉ ở mạng nội bộ (VLAN 20),
# API và web_server cũng không có mật khẩu, nên mật khẩu OTA không thêm lớp bảo vệ nào.
ota:
  - platform: esphome

# Nạp OTA hỏng mà thiết bị khởi động lại liên tục (≥10 lần, mỗi lần < 1 phút)
# thì ở chế độ an toàn: chỉ Wi-Fi + OTA, để nạp lại bản khác qua mạng.
safe_mode:

web_server:
  port: 80

time:
  - platform: sntp

# ───────────────────────── Wi-Fi ─────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # KHÔNG ghim bssid/channel: từ ESPHome 2026.x thiết bị chỉ nhận đúng AP đã
  # ghim, AP bị thay hay đổi kênh là mất mạng vĩnh viễn (sự cố 19→22/11/2026:
  # BSSID ghim thuộc AP cũ đã thay). fast_connect=false để quét cả 3 AP Aruba
  # cùng SSID và chọn AP mạnh nhất, thay vì vào AP đầu tiên tìm thấy.
  fast_connect: false
  power_save_mode: none
  reboot_timeout: 10min
  # Lối cứu: không vào được Wi-Fi nhà sau 1 phút thì phát điểm truy cập riêng.
  # Nối điện thoại vào "${name}-cuu" (mật khẩu ap_password), mở 192.168.4.1
  # để nhập lại Wi-Fi; nạp firmware: esphome upload ... --device 192.168.4.1.
  ap:
    ssid: "${name}-cuu"
    password: !secret ap_password

captive_portal:

# ───────────────────────── Chẩn đoán ─────────────────────────
sensor:
  - platform: uptime
    name: "Uptime Seconds"
    id: uptime_sec
    update_interval: 60s
    entity_category: diagnostic

  - platform: template
    name: "Heap Free"
    unit_of_measurement: "kB"
    icon: mdi:memory
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      return heap_caps_get_free_size(MALLOC_CAP_8BIT) / 1024.0f;

  - platform: wifi_signal
    id: rssi_dbm
    name: "WiFi RSSI"
    update_interval: 30s
    entity_category: diagnostic
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: copy
    source_id: rssi_dbm
    name: "WiFi Quality"
    unit_of_measurement: "%"
    icon: mdi:wifi
    accuracy_decimals: 0
    entity_category: diagnostic
    device_class: ""
    state_class: measurement
    filters:
      # -100 dBm = 0 %, -50 dBm = 100 %
      - lambda: return clamp((x + 100.0f) * 2.0f, 0.0f, 100.0f);

text_sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "WiFi IP"
    ssid:
      name: "WiFi SSID"
    # Cho biết đang bám AP Aruba nào (T1/T2/T3)
    bssid:
      name: "WiFi BSSID"
    mac_address:
      name: "WiFi MAC"

button:
  - platform: restart
    name: "Restart thiết bị"
  - platform: safe_mode
    name: "Khởi động chế độ an toàn"
    entity_category: diagnostic
